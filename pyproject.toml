[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-amortization"
version = "0.1.0"
description = "Reproducible DNS connection-reuse measurements for COMP631"
requires-python = ">=3.11"
dependencies = ["dnspython==2.8.0", "httpx[http2]==0.28.1", "httpcore==1.0.9", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dnsbench = "dnsbench.cli:main"

[tool.setuptools.packages.find]
include = ["dnsbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
